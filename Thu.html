<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tặng Cục Dàng 💌</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    font-family: Georgia, serif;
    background:
        radial-gradient(circle at top, #ffd6df, transparent 45%),
        linear-gradient(135deg, #ff758c, #ff9a9e);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ======================
   NỀN TIM
====================== */

.bg-heart {
    position: fixed;
    bottom: -50px;
    pointer-events: none;
    animation: fly 7s linear forwards;
    z-index: 0;
}

@keyframes fly {
    0% {
        transform: translateY(0) scale(.7) rotate(0);
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    100% {
        transform: translateY(-110vh) scale(1.5) rotate(30deg);
        opacity: 0;
    }
}

/* ======================
   MÀN HÌNH MỞ THƯ
====================== */

.start-screen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background:
        linear-gradient(135deg, #ff758c, #ff7eb3);
    transition: 1s;
}

.start-screen.hide {
    opacity: 0;
    pointer-events: none;
}

.start-title {
    color: white;
    font-size: 28px;
    margin-bottom: 35px;
    text-shadow: 0 3px 10px rgba(0,0,0,.2);
}

/* ======================
   PHONG BÌ
====================== */

.envelope {
    width: 300px;
    height: 200px;
    position: relative;
    cursor: pointer;
    perspective: 1000px;
}

.env-body {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #fff0f3;
    border-radius: 8px;
    box-shadow: 0 20px 40px rgba(0,0,0,.25);
    overflow: hidden;
}

/* Hai góc giấy */

.env-body::before {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    border-style: solid;
    border-width: 0 150px 110px 0;
    border-color: transparent #ffd5df transparent transparent;
}

.env-body::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: 0;
    border-style: solid;
    border-width: 110px 150px 0 0;
    border-color: #ffc3d0 transparent transparent transparent;
}

/* Nắp phong bì */

.flap {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    background: #ffb6c5;
    clip-path: polygon(0 0, 100% 0, 50% 55%);
    transform-origin: top;
    transition: 1s ease;
    z-index: 5;
}

/* Tim niêm phong */

.seal {
    position: absolute;
    z-index: 6;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -10%);
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: #e63956;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 28px;
    box-shadow: 0 5px 15px rgba(0,0,0,.2);
}

/* Khi mở */

.envelope.open .flap {
    transform: rotateX(180deg);
}

.envelope.open .seal {
    opacity: 0;
}

/* ======================
   BỨC THƯ
====================== */

.letter-container {
    position: relative;
    z-index: 2;
    width: 92%;
    max-width: 650px;
    margin: 40px auto;
    opacity: 0;
    transform: translateY(50px) scale(.95);
    pointer-events: none;
    transition: 1.2s ease;
}

.letter-container.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
}

.paper {
    background:
        linear-gradient(rgba(255,255,255,.88), rgba(255,255,255,.88)),
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 31px,
            rgba(210,150,160,.15) 32px
        );

    padding: 40px 30px;
    border-radius: 5px;
    box-shadow:
        0 20px 60px rgba(0,0,0,.25),
        inset 0 0 40px rgba(180,100,100,.08);

    position: relative;
}

/* Trang giấy */

.paper::before {
    content: "💗";
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 25px;
    opacity: .5;
}

.title {
    text-align: center;
    color: #c73b58;
    font-size: 30px;
    margin-bottom: 25px;
    font-family: cursive;
}

#letterText {
    min-height: 380px;
    color: #593b42;
    font-size: 20px;
    line-height: 2;
    font-family: "Comic Sans MS", "Segoe Print", cursive;
    white-space: normal;
}

.cursor {
    display: inline-block;
    width: 2px;
    height: 23px;
    background: #c73b58;
    margin-left: 2px;
    animation: blink .7s infinite;
}

@keyframes blink {
    50% {
        opacity: 0;
    }
}

/* ======================
   NÚT
====================== */

.buttons {
    margin-top: 30px;
    display: none;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}

.buttons.show {
    display: flex;
}

.btn {
    border: none;
    padding: 14px 24px;
    border-radius: 30px;
    font-size: 17px;
    cursor: pointer;
    transition: .25s;
    font-family: inherit;
}

.btn:hover {
    transform: translateY(-3px) scale(1.03);
}

.yes {
    background: #e63956;
    color: white;
    box-shadow: 0 8px 20px rgba(230,57,86,.3);
}

.think {
    background: #ffe1e7;
    color: #a33a4f;
}

/* ======================
   PHẢN HỒI
====================== */

.response {
    display: none;
    margin-top: 25px;
    text-align: center;
    font-family: cursive;
    color: #c73b58;
    font-size: 22px;
    animation: pop .6s ease;
}

.response.show {
    display: block;
}

@keyframes pop {
    from {
        transform: scale(.5);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }
}

/* ======================
   NÚT NHẠC
====================== */

.music {
    position: fixed;
    right: 15px;
    top: 15px;
    z-index: 20;
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,.85);
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,.15);
}

/* Mobile */

@media(max-width:500px) {

    .envelope {
        width: 280px;
        height: 185px;
    }

    .start-title {
        font-size: 24px;
    }

    .paper {
        padding: 30px 20px;
    }

    .title {
        font-size: 26px;
    }

    #letterText {
        font-size: 17px;
        line-height: 1.9;
    }
}
</style>
</head>

<body>

<!-- MÀN HÌNH BAN ĐẦU -->

<div class="start-screen" id="startScreen">

    <div class="start-title">
        💌 Có một bức thư dành cho bé
    </div>

    <div class="envelope" id="envelope">

        <div class="env-body"></div>

        <div class="flap"></div>

        <div class="seal">
            ❤️
        </div>

    </div>

    <p style="color:white; margin-top:25px;">
        Chạm vào phong bì để mở 💗
    </p>

</div>


<!-- NÚT NHẠC -->

<button class="music" id="musicBtn">
    🔇
</button>


<!-- BỨC THƯ -->

<div class="letter-container" id="letterContainer">

    <div class="paper">

        <div class="title">
            Gửi Em Bé 💌
        </div>

        <div id="letterText"></div>

        <div class="buttons" id="buttons">

        

        </div>

        <div class="response" id="response"></div>

    </div>

</div>


<script>

/* =================================
   NỘI DUNG THƯ
================================= */

const letter = `
Cảm ơn em vì đã xuất hiện và bước vào cuộc đời anh. ❤️

Cảm ơn em vì đã cho anh biết cảm giác được quan tâm, được yêu thương và có một người để mong chờ mỗi ngày là như thế nào. Có thể trước khi gặp em, cuộc sống của anh vẫn cứ trôi qua bình thường, nhưng từ khi em đến, mọi thứ dường như trở nên đặc biệt hơn.

Cảm ơn em vì những nụ cười, những cuộc trò chuyện, những khoảnh khắc bình dị mà anh sẽ luôn trân trọng. Anh không biết tương lai sẽ ra sao, chúng ta sẽ đi cùng nhau được bao lâu, nhưng anh thật lòng biết ơn vì giữa hàng tỷ người ngoài kia, anh đã có cơ hội gặp được em.
`;


/* =================================
   MỞ PHONG BÌ
================================= */

const envelope = document.getElementById("envelope");
const startScreen = document.getElementById("startScreen");
const letterContainer = document.getElementById("letterContainer");

let opened = false;

envelope.addEventListener("click", () => {

    if(opened) return;

    opened = true;

    envelope.classList.add("open");

    startMusic();

    setTimeout(() => {

        startScreen.classList.add("hide");

        setTimeout(() => {

            letterContainer.classList.add("show");

            setTimeout(() => {
                typeLetter();
            }, 900);

        }, 700);

    }, 1000);

});


/* =================================
   CHỮ CHẠY TỪNG KÝ TỰ
================================= */

let index = 0;

function typeLetter() {

    if(index < letter.length) {

        let current = letter.substring(0, index + 1);

        document.getElementById("letterText").innerHTML =
            formatText(current) +
            '<span class="cursor"></span>';

        index++;

        /*
        Tốc độ viết chữ.
        Số càng nhỏ = càng nhanh.
        */

        setTimeout(typeLetter, 42);

    } else {

        document.getElementById("letterText").innerHTML =
            formatText(letter);

        setTimeout(() => {

            document.getElementById("buttons").classList.add("show");

            createHearts();

        }, 1000);

    }

}


/* Xuống dòng */

function formatText(text) {

    return text
        .replace(/\n/g, "<br>");
}


/* =================================
   TIM BAY
================================= */

function createHearts() {

    setInterval(() => {

        const heart = document.createElement("div");

        heart.className = "bg-heart";

        const hearts = [
            "❤️",
            "💕",
            "💗",
            "💖",
            "💘",
            "🌸"
        ];

        heart.innerHTML =
            hearts[Math.floor(Math.random() * hearts.length)];

        heart.style.left =
            Math.random() * 100 + "vw";

        heart.style.fontSize =
            (15 + Math.random() * 25) + "px";

        heart.style.animationDuration =
            (5 + Math.random() * 5) + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 10000);

    }, 500);

}


/* =================================
   TIM BÙNG NỔ
================================= */

function createBigHearts() {

    for(let i = 0; i < 60; i++) {

        setTimeout(() => {

            const heart = document.createElement("div");

            heart.className = "bg-heart";

            heart.innerHTML = "❤️";

            heart.style.left =
                Math.random() * 100 + "vw";

            heart.style.fontSize =
                (20 + Math.random() * 35) + "px";

            heart.style.animationDuration =
                (2 + Math.random() * 3) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);

        }, i * 50);

    }

}


/* =================================
   NHẠC NỀN
   TỰ TẠO BẰNG WEB AUDIO
================================= */

let audioContext;
let musicPlaying = false;
let musicTimer;

const musicBtn =
    document.getElementById("musicBtn");

function startMusic() {

    if(musicPlaying) return;

    try {

        audioContext =
            new (window.AudioContext ||
            window.webkitAudioContext)();

        musicPlaying = true;

        musicBtn.innerHTML = "🎵";

        playMelody();

    } catch(e) {

        console.log("Không thể phát nhạc");

    }

}


/* Giai điệu nhẹ */

function playTone(freq, duration, startTime) {

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type = "sine";

    osc.frequency.value = freq;

    gain.gain.setValueAtTime(
        0,
        startTime
    );

    gain.gain.linearRampToValueAtTime(
        0.045,
        startTime + 0.05
    );

    gain.gain.linearRampToValueAtTime(
        0,
        startTime + duration
    );

    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );

    osc.start(startTime);

    osc.stop(
        startTime + duration
    );

}


/* Giai điệu */

function playMelody() {

    if(!musicPlaying) return;

    const notes = [
        261.63,
        329.63,
        392.00,
        329.63,

        293.66,
        349.23,
        440.00,
        349.23,

        261.63,
        329.63,
        392.00,
        523.25,

        392.00,
        329.63,
        293.66,
        261.63
    ];

    const now =
        audioContext.currentTime;

    notes.forEach((note, i) => {

        playTone(
            note,
            0.65,
            now + i * 0.45
        );

    });

    musicTimer = setTimeout(
        playMelody,
        notes.length * 450
    );

}


/* Nút bật/tắt nhạc */

musicBtn.addEventListener("click", () => {

    if(!audioContext) {

        startMusic();

        return;
    }

    if(musicPlaying) {

        musicPlaying = false;

        clearTimeout(musicTimer);

        audioContext.suspend();

        musicBtn.innerHTML = "🔇";

    } else {

        musicPlaying = true;

        audioContext.resume();

        musicBtn.innerHTML = "🎵";

        playMelody();

    }

});

</script>

</body>
</html>
